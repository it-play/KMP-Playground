name: Windows MSI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-msi:
    name: Test and package MSI
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run desktop tests
        shell: pwsh
        run: .\gradlew.bat :composeApp:desktopTest --no-daemon

      - name: Build Windows installer
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageMsi --no-daemon

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: MarketLedger2040-Windows-MSI
          path: composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
