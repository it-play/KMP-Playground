name: Kotlin Multiplatform Automation Workflow

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-offline-package:
    name: Validate Offline Signed Package
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create Ephemeral PR Trust Inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            throw 'OpenSSL is required to validate the Ed25519 release pipeline.'
          }
          $keyDirectory = Join-Path $env:RUNNER_TEMP 'market-ledger-pr-keys'
          New-Item -ItemType Directory -Path $keyDirectory -Force | Out-Null

          function New-Ed25519Pair {
            param([string] $Prefix)
            $privatePath = Join-Path $keyDirectory "$Prefix-private.pk8"
            $publicPath = Join-Path $keyDirectory "$Prefix-public.der"
            & openssl genpkey -algorithm ED25519 -outform DER -out $privatePath
            if ($LASTEXITCODE -ne 0) { throw "Failed to generate $Prefix private key." }
            & openssl pkey -in $privatePath -inform DER -pubout -outform DER -out $publicPath
            if ($LASTEXITCODE -ne 0) { throw "Failed to derive $Prefix public key." }
            return @(
              [Convert]::ToBase64String([IO.File]::ReadAllBytes($privatePath)),
              [Convert]::ToBase64String([IO.File]::ReadAllBytes($publicPath))
            )
          }

          $debugPair = New-Ed25519Pair -Prefix 'debug'
          $feedPair = New-Ed25519Pair -Prefix 'feed'
          $cohort = [Convert]::ToHexString(
            [Security.Cryptography.RandomNumberGenerator]::GetBytes(32)
          ).ToLowerInvariant()
          $packageTimestamp = [DateTimeOffset]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          Write-Output "::add-mask::$($debugPair[0])"
          Write-Output "::add-mask::$($feedPair[0])"
          Write-Output "::add-mask::$cohort"
          "ELECTRON_BUILDER_OFFLINE=true" >> $env:GITHUB_ENV
          "ML_BUILD_CHANNEL=release" >> $env:GITHUB_ENV
          "ML_BUILD_COHORT=$cohort" >> $env:GITHUB_ENV
          "ML_RELEASE_PUBLISHED_AT=$packageTimestamp" >> $env:GITHUB_ENV
          "ML_DEBUG_BUNDLE_SIGNING_KEY_PKCS8_BASE64=$($debugPair[0])" >> $env:GITHUB_ENV
          "ML_DEBUG_BUNDLE_SIGNING_PUBLIC_KEY_X509_BASE64=$($debugPair[1])" >> $env:GITHUB_ENV
          "ML_FEED_SIGNING_KEY_PKCS8_B64=$($feedPair[0])" >> $env:GITHUB_ENV
          "ML_FEED_SIGNING_PUBLIC_KEY_X509_B64=$($feedPair[1])" >> $env:GITHUB_ENV
          $prCertificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=Market Ledger PR Validation' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -NotAfter ([DateTime]::UtcNow.AddDays(1))
          "ML_WINDOWS_SIGNING_CERT_SHA1=$($prCertificate.Thumbprint)" >> $env:GITHUB_ENV
          "PR_WINDOWS_SIGNING_CERT_SHA1=$($prCertificate.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build and Verify Ephemeral Offline Windows Package
        shell: pwsh
        run: .\gradlew.bat clean buildWindowsRelease --configuration-cache --no-daemon

      - name: Remove Ephemeral PR Trust Material
        if: always()
        shell: pwsh
        run: |
          $keyDirectory = Join-Path $env:RUNNER_TEMP 'market-ledger-pr-keys'
          $materializedPrivateKey = Join-Path $env:GITHUB_WORKSPACE `
            'composeApp/src/debugModBundle/build/trust/material/debug-signing-private-key.pk8'
          Remove-Item -LiteralPath $keyDirectory -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $materializedPrivateKey -Force -ErrorAction SilentlyContinue
          if (-not [string]::IsNullOrWhiteSpace($env:PR_WINDOWS_SIGNING_CERT_SHA1)) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:PR_WINDOWS_SIGNING_CERT_SHA1" `
              -DeleteKey -Force -ErrorAction SilentlyContinue
          }

  package-stable-release:
    name: Package Offline Stable Game and Launcher
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    environment: market-ledger-stable
    concurrency:
      group: market-ledger-stable-package
      cancel-in-progress: false

    steps:
      - name: Check out Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile Desktop Projects
        shell: pwsh
        run: >-
          .\gradlew.bat
          :composeApp:compileKotlinDesktop
          :debugModBundle:compileKotlin
          :launcherApp:compileKotlin
          --configuration-cache
          --no-daemon

      - name: Decide Whether to Package a Version
        id: version
        shell: pwsh
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-MsiVersion {
            param([string] $Value, [string] $Source)
            if ($Value -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw "$Source must use MAJOR.MINOR.PATCH without leading zeroes: $Value"
            }
            $parts = $Value.Split('.') | ForEach-Object { [int] $_ }
            if ($parts[0] -gt 255 -or $parts[1] -gt 255 -or $parts[2] -gt 65535) {
              throw "$Source exceeds the Windows MSI limit 255.255.65535: $Value"
            }
          }
          function Find-SingleVersion {
            param([string[]] $Lines, [string] $Pattern, [string] $Source)
            $versions = @()
            foreach ($line in $Lines) {
              if ($line -match $Pattern) { $versions += $Matches[1] }
            }
            if ($versions.Count -gt 1) { throw "$Source contains more than one version declaration" }
            if ($versions.Count -eq 1) { return $versions[0] }
            return $null
          }

          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Offline stable packaging requires refs/heads/main.'
          }
          $appVersion = (.\gradlew.bat -q :composeApp:printAppVersion --no-daemon | Select-Object -Last 1).Trim()
          Assert-MsiVersion -Value $appVersion -Source 'appVersion'

          $shouldPackage = $false
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $checkedOutSha = (& git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $checkedOutSha -ne $env:GITHUB_SHA) {
              throw 'The checked-out commit does not match the push event.'
            }
            $previousSha = $env:PUSH_BEFORE_SHA
            if ($previousSha -notmatch '^[0-9a-f]{40}$' -or $previousSha -match '^0{40}$') {
              throw "Cannot prove a version increase from push before SHA '$previousSha'."
            }
            $previousCommitSpec = "$previousSha^{commit}"
            & git cat-file -e $previousCommitSpec
            if ($LASTEXITCODE -ne 0) { throw 'Push before commit is unavailable.' }
            $previousPropertiesSpec = $previousSha + ':gradle.properties'
            $previousProperties = @(& git show $previousPropertiesSpec)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read the previous gradle.properties.' }
            $previousVersion = Find-SingleVersion -Lines $previousProperties -Pattern '^\s*appVersion\s*=\s*([^\s#]+)\s*(?:#.*)?$' -Source "gradle.properties at $previousSha"
            if ($null -eq $previousVersion) { throw 'Cannot determine the previous appVersion.' }
            Assert-MsiVersion -Value $previousVersion -Source 'previous appVersion'
            if ([version] $appVersion -lt [version] $previousVersion) {
              throw "appVersion regressed from $previousVersion to $appVersion."
            }
            $shouldPackage = [version] $appVersion -gt [version] $previousVersion
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $shouldPackage = $true
          } else {
            throw "Unsupported event for offline stable packaging: $env:GITHUB_EVENT_NAME"
          }

          "appVersion=$appVersion" >> $env:GITHUB_OUTPUT
          "should_package=$($shouldPackage.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($shouldPackage) {
            "Offline stable package $appVersion will be assembled as an Actions artifact." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Offline packaging skipped because appVersion remains $appVersion." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Configure one Package Trust Cohort
        id: package_trust
        if: steps.version.outputs.should_package == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cohort = [Convert]::ToHexString(
            [Security.Cryptography.RandomNumberGenerator]::GetBytes(32)
          ).ToLowerInvariant()
          $packageTimestamp = [DateTimeOffset]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          "cohort=$cohort" >> $env:GITHUB_OUTPUT
          "package_timestamp=$packageTimestamp" >> $env:GITHUB_OUTPUT

      - name: Import Windows Code-Signing Certificate
        id: windows_signing
        if: steps.version.outputs.should_package == 'true'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.ML_WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.ML_WINDOWS_SIGNING_CERT_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.ML_WINDOWS_SIGNING_CERT_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
            throw 'Windows Authenticode certificate secrets are required.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'market-ledger-code-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $securePassword = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificates = @(Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -Password $securePassword `
            -Exportable:$false)
          Remove-Item -LiteralPath $pfxPath -Force
          $thumbprintPath = Join-Path $env:RUNNER_TEMP 'market-ledger-code-signing.thumbprints'
          [IO.File]::WriteAllLines($thumbprintPath, @($certificates | ForEach-Object { $_.Thumbprint }))
          $signers = @($certificates | Where-Object { $_.HasPrivateKey })
          if ($signers.Count -ne 1) {
            throw 'The PFX must import exactly one certificate with a private key.'
          }
          $certificate = $signers[0]
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          if (
              $certificate.NotBefore.ToUniversalTime() -gt [DateTime]::UtcNow -or
              $certificate.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) {
            throw 'The Windows code-signing certificate is not currently valid with a private key.'
          }
          $codeSigningOid = '1.3.6.1.5.5.7.3.3'
          $enhancedKeyUsageOids = @(
            $certificate.EnhancedKeyUsageList | ForEach-Object { [string] $_.ObjectId }
          )
          if ($enhancedKeyUsageOids -notcontains $codeSigningOid) {
            throw 'The Windows certificate does not permit code signing.'
          }
          if ($env:EXPECTED_CERT_SHA256 -notmatch '^[0-9A-F]{64}$') {
            throw 'ML_WINDOWS_SIGNING_CERT_SHA256 must be an uppercase SHA-256 certificate fingerprint.'
          }
          $certificateSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($certificate.RawData)
          )
          if ($certificateSha256 -cne $env:EXPECTED_CERT_SHA256) {
            throw 'The imported Windows signing certificate does not match the pinned SHA-256 fingerprint.'
          }
          if ($certificate.Subject -cne $certificate.Issuer) {
            throw 'The project-owned Windows signing certificate must be self-signed.'
          }
          $publicCertificatePath = Join-Path $env:RUNNER_TEMP 'market-ledger-code-signing.cer'
          Export-Certificate -Cert $certificate -FilePath $publicCertificatePath -Type CERT | Out-Null
          'Windows artifacts use the project-owned, SHA-256-pinned internal signing certificate without timestamping.' >> `
            $env:GITHUB_STEP_SUMMARY

      - name: Build one Fully Signed Offline Windows Package
        if: steps.version.outputs.should_package == 'true'
        shell: pwsh
        env:
          ELECTRON_BUILDER_OFFLINE: "true"
          ML_BUILD_CHANNEL: release
          ML_BUILD_COHORT: ${{ steps.package_trust.outputs.cohort }}
          ML_RELEASE_PUBLISHED_AT: ${{ steps.package_trust.outputs.package_timestamp }}
          ML_DEBUG_BUNDLE_SIGNING_KEY_PKCS8_BASE64: ${{ secrets.ML_DEBUG_BUNDLE_SIGNING_KEY_PKCS8_BASE64 }}
          ML_DEBUG_BUNDLE_SIGNING_PUBLIC_KEY_X509_BASE64: ${{ vars.ML_DEBUG_BUNDLE_SIGNING_PUBLIC_KEY_X509_BASE64 }}
          ML_FEED_SIGNING_KEY_PKCS8_B64: ${{ secrets.ML_FEED_SIGNING_KEY_PKCS8_B64 }}
          ML_FEED_SIGNING_PUBLIC_KEY_X509_B64: ${{ vars.ML_FEED_SIGNING_PUBLIC_KEY_X509_B64 }}
          ML_WINDOWS_SIGNING_CERT_SHA1: ${{ steps.windows_signing.outputs.thumbprint }}
        run: .\gradlew.bat clean buildWindowsRelease --configuration-cache --no-daemon

      - name: Remove Materialized Package Private Key File
        if: always() && steps.version.outputs.should_package == 'true'
        shell: pwsh
        run: |
          $materializedPrivateKey = Join-Path $env:GITHUB_WORKSPACE `
            'composeApp/src/debugModBundle/build/trust/material/debug-signing-private-key.pk8'
          Remove-Item -LiteralPath $materializedPrivateKey -Force -ErrorAction SilentlyContinue

      - name: Verify launcher and MSI Authenticode signatures
        if: steps.version.outputs.should_package == 'true'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.appVersion }}
          EXPECTED_THUMBPRINT: ${{ steps.windows_signing.outputs.thumbprint }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:GITHUB_WORKSPACE `
            "composeApp/src/launcherApp/build/compose/binaries/main/msi/MarketLedger2040-Launcher-$env:APP_VERSION.msi"
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) { throw 'Launcher MSI is missing.' }
          $appImage = Join-Path $env:GITHUB_WORKSPACE `
            'composeApp/src/launcherApp/build/compose/binaries/main/app'
          $launchers = @(Get-ChildItem `
            -LiteralPath $appImage `
            -Filter 'MarketLedger2040Launcher.exe' -File -Recurse)
          if ($launchers.Count -ne 1) {
            throw 'Expected exactly one launcher executable in the packaged app image.'
          }
          $publicCertificatePath = Join-Path $env:RUNNER_TEMP 'market-ledger-code-signing.cer'
          if (-not (Test-Path -LiteralPath $publicCertificatePath -PathType Leaf)) {
            throw 'The validated public code-signing certificate is missing.'
          }
          Write-Host 'Adding the pinned certificate to the temporary machine trust store...'
          $trustedRoots = @(Import-Certificate `
            -FilePath $publicCertificatePath `
            -CertStoreLocation 'Cert:\LocalMachine\Root')
          if ($trustedRoots.Count -ne 1 -or
              $trustedRoots[0].Thumbprint -cne $env:EXPECTED_THUMBPRINT) {
            throw 'The pinned internal signing certificate was not added to the temporary trust store.'
          }
          Write-Host 'The temporary machine trust store is ready.'
          $signTool = Get-Command signtool -ErrorAction SilentlyContinue
          if ($null -eq $signTool) {
            $windowsKitsBin = Join-Path "${env:ProgramFiles(x86)}" 'Windows Kits\10\bin'
            $signTool = Get-ChildItem -LiteralPath $windowsKitsBin -Directory | `
              ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } | `
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | `
              Sort-Object -Descending | `
              Select-Object -First 1 | `
              ForEach-Object { Get-Item -LiteralPath $_ }
          }
          if ($null -eq $signTool) { throw 'signtool.exe was not found.' }
          $signToolPath = if ($signTool -is [System.Management.Automation.ApplicationInfo]) {
            $signTool.Source
          } else {
            $signTool.FullName
          }
          foreach ($file in @($launchers[0].FullName, $msi)) {
            Write-Host "Verifying $([IO.Path]::GetFileName($file))..."
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
                $signature.SignerCertificate.Thumbprint -ne $env:EXPECTED_THUMBPRINT) {
              throw "Authenticode signature verification failed for $([IO.Path]::GetFileName($file))."
            }
            & $signToolPath verify /pa /all /v $file
            if ($LASTEXITCODE -ne 0) { throw 'signtool rejected an offline launcher package artifact.' }
          }

      - name: Verify Embedded Release Closure and Stage Launcher MSI
        if: steps.version.outputs.should_package == 'true'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.appVersion }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:GITHUB_WORKSPACE 'build/release'
          $package = Join-Path $env:RUNNER_TEMP 'market-ledger-offline-package'
          if (-not (Test-Path -LiteralPath $release -PathType Container)) {
            throw 'The signed offline package output directory is missing.'
          }
          $expected = @(
            "market-ledger-game-$env:APP_VERSION-windows-x64.zip",
            "market-ledger-debug-$env:APP_VERSION-windows-x64.zip",
            "market-ledger-game-$env:APP_VERSION-windows-x64.inventory.json",
            'market-ledger-stable-feed.json',
            'market-ledger-stable-feed.json.sig'
          )
          $actualEntries = @(Get-ChildItem -LiteralPath $release -Force)
          $actualFiles = @($actualEntries | Where-Object { -not $_.PSIsContainer })
          $differences = @(Compare-Object `
            -ReferenceObject @($expected | Sort-Object) `
            -DifferenceObject @($actualFiles.Name | Sort-Object))
          if ($actualEntries.Count -ne $expected.Count -or $differences.Count -ne 0) {
            throw 'build/release does not contain exactly the five signed offline payload assets.'
          }
          Remove-Item -LiteralPath $package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $package | Out-Null
          $msi = Join-Path $env:GITHUB_WORKSPACE `
            "composeApp/src/launcherApp/build/compose/binaries/main/msi/MarketLedger2040-Launcher-$env:APP_VERSION.msi"
          $msiName = [IO.Path]::GetFileName($msi)
          Copy-Item -LiteralPath $msi -Destination (Join-Path $package $msiName)
          $actualPackageEntries = @(Get-ChildItem -LiteralPath $package -Force)
          if ($actualPackageEntries.Count -ne 1 -or
              @($actualPackageEntries | Where-Object { $_.PSIsContainer }).Count -ne 0 -or
              $actualPackageEntries[0].Name -cne $msiName) {
            throw 'The offline package must contain only the bundled launcher MSI.'
          }

      - name: Upload verified offline Windows package
        if: steps.version.outputs.should_package == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MarketLedger2040-${{ steps.version.outputs.appVersion }}-Offline-Windows-x64
          path: ${{ runner.temp }}/market-ledger-offline-package/*
          if-no-files-found: error
          retention-days: 90

      - name: Remove imported signing material
        if: always() && steps.version.outputs.should_package == 'true'
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.windows_signing.outputs.thumbprint }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'market-ledger-code-signing.pfx'
          $publicCertificatePath = Join-Path $env:RUNNER_TEMP 'market-ledger-code-signing.cer'
          $thumbprintPath = Join-Path $env:RUNNER_TEMP 'market-ledger-code-signing.thumbprints'
          Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $publicCertificatePath -Force -ErrorAction SilentlyContinue
          $thumbprints = @()
          if (Test-Path -LiteralPath $thumbprintPath -PathType Leaf) {
            $thumbprints += [IO.File]::ReadAllLines($thumbprintPath)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_THUMBPRINT)) {
            $thumbprints += $env:CERTIFICATE_THUMBPRINT
          }
          foreach ($thumbprint in @($thumbprints | Sort-Object -Unique)) {
            if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
              $signingCertificatePath = "Cert:\CurrentUser\My\$thumbprint"
              Remove-Item `
                -LiteralPath $signingCertificatePath `
                -DeleteKey -Force -ErrorAction SilentlyContinue
              $trustedCertificatePath = "Cert:\LocalMachine\Root\$thumbprint"
              Remove-Item `
                -LiteralPath $trustedCertificatePath `
                -Force -ErrorAction SilentlyContinue
            }
          }
          Remove-Item -LiteralPath $thumbprintPath -Force -ErrorAction SilentlyContinue
